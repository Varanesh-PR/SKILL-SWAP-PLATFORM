<!DOCTYPE html>
<html>
<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  background: linear-gradient(to right, #ff7e5f, #feb47b);
}
.card {
  border-radius: 15px;
}
</style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 shadow" style="width:350px;">

<h2 class="text-center text-primary mb-2">SKILL SWAP PLATFORM</h2>
<p class="text-center text-muted">Create your account</p>

<form method="POST">
<input class="form-control mb-2" name="username" placeholder="Username" required>
<input class="form-control mb-2" name="password" type="password" placeholder="Password" required>
<input class="form-control mb-2" name="teach" placeholder="Skill you teach">
<input class="form-control mb-3" name="learn" placeholder="Skill you learn">

<button class="btn btn-success w-100">Register</button>
</form>

<p class="text-center mt-2">
<a href="/">Already have an account? Login</a>
</p>

</div>

</body>
</html>
