<!DOCTYPE html>
<html>
<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

<h3>💬 Chat with {{ other }}</h3>

<div id="msgs" class="border rounded p-3 mb-2" style="height:250px; overflow:auto;"></div>

<div class="input-group">
<input id="msg" class="form-control">
<button class="btn btn-primary" onclick="send()">Send</button>
</div>

<script>
function load(){
fetch('/messages/{{ other }}').then(r=>r.json()).then(d=>{
let html="";
d.forEach(m=>{
html+=`<p><b>${m.sender}:</b> ${m.message}</p>`;
});
document.getElementById("msgs").innerHTML=html;
});
}

function send(){
fetch('/send',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
to:"{{ other }}",
msg:document.getElementById("msg").value
})
}).then(load);
}

setInterval(load,1000);
</script>

</body>
</html>
